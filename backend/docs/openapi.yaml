openapi: 3.1.0
info:
  title: Widget Platform API
  version: 1.0.0
  description: Widget Management, Schema, and Publishing API for Widget Platform (Phase 3–5)
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Widgets
    description: Widget management endpoints
paths:
  /api/v1/widgets:
    get:
      tags: [Widgets]
      summary: List widgets
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
            maximum: 100
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            enum: [createdAt, updatedAt, publishedAt, name]
            default: updatedAt
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, ARCHIVED]
        - in: query
          name: themeId
          schema:
            type: string
            format: uuid
        - in: query
          name: createdBy
          schema:
            type: string
            format: uuid
        - in: query
          name: deleted
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Paginated widget list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Widgets]
      summary: Create widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWidgetRequest'
            example:
              workspaceId: 22222222-2222-2222-2222-222222222222
              name: Contact Us
              description: Primary contact form
              createdBy: 33333333-3333-3333-3333-333333333333
      responses:
        '201':
          description: Widget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/widgets/{id}:
    get:
      tags: [Widgets]
      summary: Get widget by ID
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      responses:
        '200':
          description: Widget details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Widgets]
      summary: Update widget metadata
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWidgetRequest'
            example:
              name: Updated Contact Form
              description: Updated description
      responses:
        '200':
          description: Widget updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Widgets]
      summary: Soft delete widget
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      responses:
        '204':
          description: Widget deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/widgets/{id}/archive:
    post:
      tags: [Widgets]
      summary: Archive widget
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      responses:
        '200':
          description: Widget archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/widgets/{id}/restore:
    post:
      tags: [Widgets]
      summary: Restore archived widget
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      responses:
        '200':
          description: Widget restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/widgets/{id}/duplicate:
    post:
      tags: [Widgets]
      summary: Duplicate widget
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateWidgetRequest'
            example:
              createdBy: 33333333-3333-3333-3333-333333333333
      responses:
        '201':
          description: Widget duplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/widgets/{id}/schema:
    get:
      tags: [Widgets]
      summary: Get widget draft schema
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      responses:
        '200':
          description: Current draft schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetSchemaResponse'
              example:
                success: true
                data:
                  widgetId: 11111111-1111-1111-1111-111111111111
                  versionId: 22222222-2222-2222-2222-222222222222
                  version: 1
                  published: false
                  schema:
                    version: 1
                    content:
                      title: Contact Us
                    layout:
                      type: popup
                    theme: {}
                    fields: []
                    behavior: {}
                    triggers:
                      type: immediate
                    localization:
                      defaultLocale: en
                    animations: {}
                    metadata:
                      name: Contact Us
                  updatedAt: '2026-08-05T12:00:00.000Z'
                message: null
                timestamp: '2026-08-05T12:00:00.000Z'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Widgets]
      summary: Update widget schema
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetSchemaRequest'
      responses:
        '200':
          description: Schema updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetSchemaResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/widgets/{id}/schema/reset:
    post:
      tags: [Widgets]
      summary: Reset widget schema to default template
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      responses:
        '200':
          description: Schema reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetSchemaResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/widgets/{id}/schema/validate:
    post:
      tags: [Widgets]
      summary: Validate widget schema without saving
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetSchemaRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetSchemaValidationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/widgets/{id}/publish:
    post:
      tags: [Widgets]
      summary: Publish widget
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      responses:
        '200':
          description: Widget published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishWidgetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/widgets/{id}/unpublish:
    post:
      tags: [Widgets]
      summary: Unpublish widget
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      responses:
        '200':
          description: Widget unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnpublishWidgetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/widgets/{id}/versions:
    get:
      tags: [Widgets]
      summary: List widget version history
      parameters:
        - $ref: '#/components/parameters/WidgetId'
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetVersionListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/widgets/{id}/versions/{versionId}:
    get:
      tags: [Widgets]
      summary: Get widget version detail
      parameters:
        - $ref: '#/components/parameters/WidgetId'
        - in: path
          name: versionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Version detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetVersionDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/widgets/{id}/versions/{versionId}/restore:
    post:
      tags: [Widgets]
      summary: Restore widget version as new draft
      parameters:
        - $ref: '#/components/parameters/WidgetId'
        - in: path
          name: versionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Version restored as new draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreVersionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    WidgetId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Widget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        description:
          type: string
          nullable: true
        embedToken:
          type: string
          nullable: true
        themeId:
          type: string
          format: uuid
          nullable: true
        createdBy:
          type: string
          format: uuid
        currentVersionId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
    CreateWidgetRequest:
      type: object
      required: [workspaceId, name, createdBy]
      properties:
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        themeId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
    UpdateWidgetRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        themeId:
          type: string
          format: uuid
          nullable: true
    DuplicateWidgetRequest:
      type: object
      required: [createdBy]
      properties:
        createdBy:
          type: string
          format: uuid
    WidgetResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Widget'
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    WidgetListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Widget'
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    WidgetSchemaDocument:
      type: object
      required:
        - version
        - content
        - layout
        - theme
        - fields
        - behavior
        - triggers
        - localization
        - animations
        - metadata
      properties:
        version:
          type: integer
          example: 1
        content:
          type: object
        layout:
          type: object
        theme:
          type: object
        fields:
          type: array
          items:
            $ref: '#/components/schemas/WidgetField'
        behavior:
          type: object
        triggers:
          type: object
        localization:
          type: object
        animations:
          type: object
        metadata:
          type: object
    WidgetField:
      type: object
      required: [id, type, label]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [text, email, phone, number, textarea, select, checkbox, radio, date, url, hidden]
        label:
          type: string
        required:
          type: boolean
        placeholder:
          type: string
        options:
          type: array
          items:
            type: string
    WidgetSchemaRequest:
      type: object
      required: [schema]
      properties:
        schema:
          $ref: '#/components/schemas/WidgetSchemaDocument'
    WidgetSchemaPayload:
      type: object
      properties:
        widgetId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        version:
          type: integer
        published:
          type: boolean
        schema:
          $ref: '#/components/schemas/WidgetSchemaDocument'
        updatedAt:
          type: string
          format: date-time
    WidgetSchemaResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WidgetSchemaPayload'
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    WidgetSchemaValidationPayload:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
    WidgetSchemaValidationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WidgetSchemaValidationPayload'
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    PublishWidgetResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PUBLISHED]
        version:
          type: integer
        versionId:
          type: string
          format: uuid
        embedToken:
          type: string
        embedSnippet:
          type: string
        publicConfigUrl:
          type: string
        publishedAt:
          type: string
          format: date-time
    PublishWidgetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PublishWidgetResult'
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    UnpublishWidgetResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT]
        publishedAt:
          type: 'null'
    UnpublishWidgetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/UnpublishWidgetResult'
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    WidgetVersionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        published:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        author:
          type: string
          format: uuid
    WidgetVersionDetail:
      allOf:
        - $ref: '#/components/schemas/WidgetVersionSummary'
        - type: object
          properties:
            widgetId:
              type: string
              format: uuid
            schema:
              $ref: '#/components/schemas/WidgetSchemaDocument'
    WidgetVersionListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/WidgetVersionSummary'
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    WidgetVersionDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/WidgetVersionDetail'
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    RestoreVersionResult:
      type: object
      properties:
        widgetId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        version:
          type: integer
        status:
          type: string
          enum: [DRAFT]
        restoredFromVersion:
          type: integer
    RestoreVersionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/RestoreVersionResult'
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        message:
          type: string
        timestamp:
          type: string
          format: date-time
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Validation failed
              details:
                fields:
                  name: [Name is required]
            message: Validation failed
            timestamp: '2026-08-05T12:00:00.000Z'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
